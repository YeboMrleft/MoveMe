name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}" > .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}" >> .env

      - name: Verify key is set
        run: |
          KEY_LEN=$(echo -n "${{ secrets.GOOGLE_MAPS_KEY }}" | wc -c)
          echo "GOOGLE_MAPS_KEY length: $KEY_LEN"
          if [ "$KEY_LEN" -eq 0 ]; then echo "ERROR: GOOGLE_MAPS_KEY secret is empty!"; exit 1; fi

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Verify key in AndroidManifest
        run: |
          echo "=== Maps API key line ==="
          grep -i "geo.API_KEY" android/app/src/main/AndroidManifest.xml || echo "ERROR: No API key found in manifest!"
          echo "=== Key length in manifest ==="
          KEY=$(grep -o 'android:value="[^"]*"' android/app/src/main/AndroidManifest.xml | grep -A1 "geo.API_KEY" | grep -o '"[^"]*"' | tr -d '"' | head -1)
          echo "Embedded key length: ${#KEY}"

      - name: Find APK
        run: find android/app/build/outputs/apk -name "*.apk" | tee apk-path.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moveme-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
