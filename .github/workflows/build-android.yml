name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}" > .env
          echo "EXPO_PUBLIC_GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}" >> .env
          echo "MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}" >> .env
          echo "EXPO_PUBLIC_MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}" >> .env
          echo "MAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> .env

      - name: Verify secrets are set
        run: |
          MAPS_LEN=$(echo -n "${{ secrets.GOOGLE_MAPS_KEY }}" | wc -c)
          MAPBOX_LEN=$(echo -n "${{ secrets.MAPBOX_TOKEN }}" | wc -c)
          DL_LEN=$(echo -n "${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" | wc -c)
          echo "GOOGLE_MAPS_KEY length: $MAPS_LEN"
          echo "MAPBOX_TOKEN length: $MAPBOX_LEN"
          echo "MAPBOX_DOWNLOADS_TOKEN length: $DL_LEN"
          if [ "$MAPBOX_LEN" -eq 0 ]; then echo "ERROR: MAPBOX_TOKEN is empty!"; exit 1; fi
          if [ "$DL_LEN" -eq 0 ]; then echo "ERROR: MAPBOX_DOWNLOADS_TOKEN is empty!"; exit 1; fi

      - name: Configure Mapbox Gradle credentials
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}" >> ~/.gradle/gradle.properties

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Find APK
        run: find android/app/build/outputs/apk -name "*.apk" | tee apk-path.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moveme-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
