<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled — Move-Me</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #E6F4FE;
      color: #0D1B2A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; display: block; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #0D1B2A; }
    p { font-size: 15px; color: #6B7280; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: block;
      background: #1E88E5;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 50px;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-ghost {
      display: block;
      color: #6B7280;
      font-size: 14px;
      text-decoration: none;
      padding: 8px;
    }
    .brand { margin-top: 28px; font-size: 12px; color: #9CA3AF; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">↩️</span>
    <h1>Payment Cancelled</h1>
    <p>No payment was taken. You can try again whenever you're ready.</p>
    <a href="moveme://payment/cancel" class="btn">Return to Move-Me</a>
    <a href="moveme://payment/cancel" class="btn-ghost">Tap here if the app doesn't open</a>
    <div class="brand">Move-Me · Powered by Inka-Tech Solutions</div>
  </div>

  <script>
    setTimeout(function() { window.location.href = 'moveme://payment/cancel'; }, 4000);
  </script>
</body>
</html>
